name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check API syntax
        run: node --check api/src/index.js && node --check api/src/pool.js

      - name: Build api image
        run: docker build -t devops-stack-api ./api

      - name: Validate docker-compose config
        run: docker compose config
